<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pagina niet gevonden – Esad Cankurtaran</title>
  <meta name="robots" content="noindex, follow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Inter", sans-serif;
      background-color: #f3f7fb;
      color: #14233a;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .wrap { max-width: 480px; }
    .code {
      font-family: "Syne", sans-serif;
      font-size: 96px;
      font-weight: 800;
      background: linear-gradient(135deg, #215a96, #3b82f6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
      margin-bottom: 16px;
    }
    h1 { font-family: "Syne", sans-serif; font-size: 24px; font-weight: 700; margin-bottom: 12px; }
    p { color: #425a78; margin-bottom: 28px; line-height: 1.7; }
    .btn {
      display: inline-block;
      background-color: #215a96;
      color: #fff;
      padding: 12px 28px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 500;
      font-size: 14px;
      transition: background-color 0.2s;
    }
    .btn:hover { background-color: #1a4a7d; }
  </style>
</head>
<body>
  <div class="wrap">
    <p class="code">404</p>
    <h1>Pagina niet gevonden</h1>
    <p>De pagina die je zoekt bestaat niet of is verplaatst. Ga terug naar de homepage om verder te bladeren.</p>
    <a class="btn" href="/">Terug naar home</a>
  </div>
</body>
</html>
